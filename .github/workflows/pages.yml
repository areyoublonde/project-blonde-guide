# Builds the guide from the committed data and content and publishes dist/ to GitHub Pages.
# The game folder is NOT needed here: data/ and site/assets/game/ are generated locally by the extractors and committed.
name: Deploy guide to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      # base_path is "/repo-name" for a project site and "" for a user site or a custom domain
      - name: Build
        run: python3 tools/build.py --base "${{ steps.pages.outputs.base_path }}"
      # Item aliases, NPC gifts and branch-opened shops in the availability audit (the Porygon2 / Porygon-Z regression)
      - name: Check availability regressions
        run: python3 tools/qa_availability.py
      - name: Check every link and asset
        run: python3 tools/qa_static.py --base "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
